aid: screaming-frog
name: Screaming Frog
description: >-
  Screaming Frog is a UK-based SEO software company and search marketing agency,
  best known for the SEO Spider website crawler tool used by SEO professionals
  worldwide to perform technical SEO audits, crawl analysis, and integrations
  with third-party APIs. The SEO Spider integrates with Google Analytics (GA4),
  Google Search Console, PageSpeed Insights, Ahrefs, Majestic, Moz, OpenAI,
  Gemini, Ollama, and Anthropic. Screaming Frog also offers a free Log File
  Analyser for analyzing server log files to understand search bot behavior.
  Screaming Frog operates no public web API. Its machine-callable surfaces are the
  SEO Spider command line interface, which runs the product fully headless, and — since
  version 24.0, released 19 May 2026 — a first-party Model Context Protocol server built
  into the desktop application, exposing 29 tools for crawl control, reports, bulk
  exports, URL inspection, screenshots, embeddings, Node scripting and sandboxed file
  access. The MCP server is a paid licence feature and runs inside the user's own
  installation over stdio or a loopback HTTP transport; there is no hosted endpoint.
