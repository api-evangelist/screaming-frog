specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Screaming Frog
providerId: screaming-frog
generated: '2026-08-13'
method: searched
source: >-
  https://www.screamingfrog.co.uk/seo-spider/pricing/ ,
  https://www.screamingfrog.co.uk/log-file-analyser/pricing/
created: '2026-05-04'
modified: '2026-08-13'
tags:
  - SEO
  - Website Crawler
  - Desktop Software
  - Licensing
description: >-
  Published pricing for the two Screaming Frog desktop products, read from the
  provider's own pricing pages on 2026-08-13. Both are per-user annual licences with a
  functional free tier, not API subscriptions — Screaming Frog sells no metered API
  access, so there are no request quotas, no overage rates and no per-call pricing to
  record. This file REPLACES a 2026-05-04 bulk-sweep scaffold that invented free /
  professional / enterprise API request tiers Screaming Frog has never offered.
plan_count: 4
currency: GBP
currency_note: The pricing pages also offer USD and EUR display currencies.
billing_period: annual
licensing_note: 'Licences are per user. 2 users will require 2 individual licences.'

plans:
  - id: seo-spider-free
    name: SEO Spider — Free
    product: Screaming Frog SEO Spider
    type: freemium
    price: '0.00'
    currency: GBP
    period: perpetual
    renewal_required: false
    description: >-
      Free version of the SEO Spider desktop crawler, capped at 500 URLs per crawl.
      Almost the full feature set is included.
    limits:
      - {name: crawl_limit, metric: urls_per_crawl, limit: 500}
    elements:
      - Find broken links
      - Analyse page titles & metadata
      - Review meta robots & directives
      - Audit hreflang attributes
      - Discover duplicate pages
      - Generate XML sitemaps
      - Site visualisations
      - Scheduling
      - Crawl configuration
      - Save & open crawls
      - JavaScript rendering
      - Crawl comparison
      - Near duplicate content detection
      - Custom robots.txt
      - Mobile usability checks
      - AMP crawling & validation
      - Structured data validation
      - Spelling & grammar checks
      - Custom source code search
      - Custom extraction
      - Custom JavaScript
      - OpenAI & Gemini integration
      - Google Analytics integration
      - Search Console integration
      - PageSpeed Insights integration
      - Accessibility auditing
      - Link Metrics integration
      - Forms-based authentication
      - Segmentation
      - Looker Studio reports
    excludes:
      - MCP Server (paid licence feature only)

  - id: seo-spider-paid
    name: SEO Spider — Paid Licence
    product: Screaming Frog SEO Spider
    type: paid
    price: '199.00'
    currency: GBP
    period: year
    renewal_required: true
    description: >-
      Annual per-user licence removing the 500 URL crawl limit and unlocking the paid-only
      features, including the SEO Spider MCP Server introduced in version 24.
    limits:
      - name: crawl_limit
        metric: urls_per_crawl
        limit: -1
        note: 'Provider states "Unlimited*" — dependent on allocated memory and storage.'
    volume_pricing:
      - {licences: '1-4', price_per_licence: '199.00'}
      - {licences: '5-9', price_per_licence: '189.00'}
      - {licences: '10-19', price_per_licence: '179.00'}
      - {licences: '20+', price_per_licence: '169.00'}
    elements:
      - All free version features
      - Unlimited crawling (memory/storage bound)
      - MCP Server

  - id: log-file-analyser-free
    name: Log File Analyser — Free
    product: Screaming Frog Log File Analyser
    type: freemium
    price: '0.00'
    currency: GBP
    period: perpetual
    renewal_required: false
    description: Free version of the Log File Analyser, capped at 1,000 log lines and a single project.
    limits:
      - {name: log_event_limit, metric: log_lines, limit: 1000}
      - {name: project_limit, metric: projects, limit: 1}
    elements:
      - Bot verification
      - Broken link detection
      - Crawl frequency analysis

  - id: log-file-analyser-paid
    name: Log File Analyser — Paid Licence
    product: Screaming Frog Log File Analyser
    type: paid
    price: '99.00'
    currency: GBP
    period: year
    renewal_required: true
    description: Annual per-user licence removing the log line and project limits.
    limits:
      - name: log_event_limit
        metric: log_lines
        limit: -1
        note: 'Provider states "Unlimited*" — the maximum number of log events is dependent on hard drive capacity.'
      - {name: project_limit, metric: projects, limit: -1}
    volume_pricing:
      - {licences: '1-4', price_per_licence: '99.00'}
      - {licences: '5-9', price_per_licence: '89.00'}
      - {licences: '10-19', price_per_licence: '79.00'}
      - {licences: '20+', price_per_licence: '69.00'}

api_pricing:
  metered_api_plans: 0
  note: >-
    Screaming Frog sells no API. The SEO Spider is instead a CONSUMER of third-party APIs
    (Google Analytics, Search Console, PageSpeed Insights, Ahrefs, Majestic, Moz, OpenAI,
    Gemini, Ollama), and the cost of those calls is billed by those providers under the
    customer's own keys, not by Screaming Frog.

maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
