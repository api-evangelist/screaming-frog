description: >-
  Screaming Frog ships desktop applications, not API client libraries. There is no
  first-party SDK on any package registry, because there is no Screaming Frog API to
  wrap — automation is done through the SEO Spider CLI and, since v24, the built-in MCP
  server. The entries below record what is actually distributed: versioned direct
  downloads from download.screamingfrog.co.uk, the two unpinned MCP extension bundles,
  community Homebrew casks, and a small set of first-party npm packages that are
  internal front-end components for screamingfrog.co.uk rather than API clients.

