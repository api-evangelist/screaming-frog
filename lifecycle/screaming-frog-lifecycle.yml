description: >-
  Lifecycle posture for Screaming Frog's desktop products. There is no API, so there is
  no API versioning scheme, no Sunset/Deprecation header practice and no service status
  page — the software runs on the customer's machine, so there is no service to be up or
  down. What the provider does publish is a long, dated release history and an annual
  licence model.

