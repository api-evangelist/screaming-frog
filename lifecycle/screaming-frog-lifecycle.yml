    - {product: Screaming Frog Log File Analyser, version: '7.1'}
  policy_published: false
  policy_note: >-
    No written versioning policy. The pattern is legible from the release history: MAJOR
    releases carry features, MINOR releases are bug fixes, and there is no
    backwards-compatibility contract to publish because nothing is served over a network.
  changelog: changelog/screaming-frog-changelog.yml
